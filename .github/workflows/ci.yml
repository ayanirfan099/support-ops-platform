name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: supportops
          POSTGRES_USER: supportops
          POSTGRES_PASSWORD: supportops-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportops -d supportops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://supportops:supportops-ci-only@localhost:5432/supportops?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-for-use-outside-automated-tests-0001
      BETTER_AUTH_URL: http://localhost:3000
      INTELLIGENCE_SERVICE_URL: http://127.0.0.1:8001
      INTELLIGENCE_SERVICE_TOKEN: ci-only-intelligence-token-not-for-use-outside-automated-tests
      DEMO_ACCOUNT_EMAIL: demo@supportops.example.invalid
      DEMO_ACCOUNT_PASSWORD: SupportOps-Demo-2026!
      DEMO_AGENT_EMAIL: agent@supportops.example.invalid
      DEMO_AGENT_PASSWORD: SupportOps-Agent-2026!
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.10.11
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Install Python dependencies from lockfile
        run: uv sync --locked --all-extras
        working-directory: services/intelligence
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Check formatting and lint
        run: |
          pnpm format:check
          pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Apply database migrations
        run: pnpm --filter @supportops/database prisma:deploy
      - name: Seed fictional demo data twice
        run: |
          pnpm db:seed
          pnpm db:seed
      - name: Run unit and database integration tests
        run: |
          pnpm test
          pnpm test:integration
      - name: Build web application
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser journeys
        run: pnpm test:e2e
      - name: Check Python formatting and lint
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
        working-directory: services/intelligence
      - name: Run Python tests
        run: uv run --locked pytest -q
        working-directory: services/intelligence

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history for secret scan
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level low
      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.10.11
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock
      - name: Export locked Python runtime dependencies
        run: uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/supportops-intelligence-requirements.txt" > /dev/null
        working-directory: services/intelligence
      - name: Audit Python dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --requirement "${RUNNER_TEMP}/supportops-intelligence-requirements.txt"
      - name: Set up Go for the MIT-licensed Gitleaks CLI
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan full Git history for secrets
        run: "$(go env GOPATH)/bin/gitleaks git --config .gitleaks.toml --redact --log-opts=--all ."

  container-smoke:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: [quality, security]
    env:
      BETTER_AUTH_SECRET: ci-only-secret-not-for-use-outside-automated-tests-0001
      BETTER_AUTH_URL: http://localhost:3000
      INTELLIGENCE_SERVICE_TOKEN: ci-only-intelligence-token-not-for-use-outside-automated-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Validate Compose configuration
        run: docker compose -f infra/docker/compose.yml --profile containerized config --quiet
      - name: Start PostgreSQL and intelligence containers
        run: docker compose -f infra/docker/compose.yml --profile containerized up --build --detach --wait --wait-timeout 240 postgres intelligence
      - name: Apply containerized migrations and seed
        run: |
          docker compose -f infra/docker/compose.yml --profile containerized run --rm migrate
          docker compose -f infra/docker/compose.yml --profile containerized run --rm seed
      - name: Start the web container and wait for health
        run: docker compose -f infra/docker/compose.yml --profile containerized up --build --detach --wait --wait-timeout 180 web
      - name: Smoke-test the web route
        run: curl --fail --silent --show-error http://127.0.0.1:3000/sign-in > /dev/null
      - name: Stop containers and remove ephemeral database
        if: always()
        run: docker compose -f infra/docker/compose.yml --profile containerized down --volumes --remove-orphans

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportops-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - supportops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 5s
      timeout: 5s
      retries: 10

  intelligence:
    profiles: [containerized]
    build:
      context: ../..
      dockerfile: services/intelligence/Dockerfile
    restart: unless-stopped
    environment:
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?Set INTELLIGENCE_SERVICE_TOKEN in .env}
    expose:
      - "8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  migrate:
    profiles: [containerized]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://supportops:${POSTGRES_PASSWORD:-supportops-local-only}@postgres:5432/supportops?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: [containerized]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: migration
    command: ["pnpm", "db:seed"]
    environment:
      DATABASE_URL: postgresql://supportops:${POSTGRES_PASSWORD:-supportops-local-only}@postgres:5432/supportops?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-demo@supportops.example.invalid}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-SupportOps-Demo-2026!}
      DEMO_AGENT_EMAIL: ${DEMO_AGENT_EMAIL:-agent@supportops.example.invalid}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-SupportOps-Agent-2026!}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [containerized]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://supportops:${POSTGRES_PASSWORD:-supportops-local-only}@postgres:5432/supportops?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      INTELLIGENCE_SERVICE_URL: http://intelligence:8001
      INTELLIGENCE_SERVICE_TOKEN: ${INTELLIGENCE_SERVICE_TOKEN:?Set INTELLIGENCE_SERVICE_TOKEN in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/sign-in').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  supportops-postgres:

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">SupportOps support workspace</title>
  <desc id="description">A workspace for support ticket operations, source-backed knowledge, and human-reviewed triage.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#f7f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#20283b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <circle cx="85" cy="80" r="210" fill="#d8f2e9" opacity=".7"/>
  <circle cx="1090" cy="610" r="280" fill="#e2e5ff" opacity=".72"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="74" y="72" width="48" height="48" rx="14" fill="#d8f2e9"/>
    <path d="M88 96h20M98 86v20" stroke="#20283b" stroke-width="5" stroke-linecap="round"/>
    <text x="138" y="105" fill="#20283b" font-size="25" font-weight="700" letter-spacing="-1">SupportOps</text>
    <text x="76" y="238" fill="#4b55c7" font-size="17" font-weight="700" letter-spacing="3">SUPPORT OPERATIONS WORKSPACE</text>
    <text x="72" y="310" fill="#20283b" font-size="54" font-weight="700" letter-spacing="-2">Clear context.</text>
    <text x="72" y="372" fill="#20283b" font-size="54" font-weight="700" letter-spacing="-2">Confident support.</text>
    <text x="76" y="430" fill="#687187" font-size="21">Tickets, source-backed knowledge, and human-reviewed</text>
    <text x="76" y="462" fill="#687187" font-size="21">triage — together in a tenant-scoped workspace.</text>
    <rect x="76" y="514" width="236" height="43" rx="21" fill="#e9ebff"/>
    <text x="96" y="542" fill="#343c9c" font-size="15" font-weight="700">Human decisions stay in control</text>

    <g filter="url(#shadow)">
      <rect x="658" y="108" width="472" height="418" rx="22" fill="#ffffff"/>
      <rect x="658" y="108" width="472" height="58" rx="22" fill="#20283b"/>
      <path d="M658 144h472v22H658z" fill="#20283b"/>
      <circle cx="690" cy="137" r="6" fill="#d8f2e9"/>
      <text x="710" y="142" fill="#f4f5ff" font-size="13" font-weight="700">Workspace overview</text>
      <text x="1048" y="142" fill="#c5cbe0" font-size="11">SAMPLE DATA</text>

      <text x="692" y="210" fill="#20283b" font-size="19" font-weight="700">Queue snapshot</text>
      <text x="692" y="235" fill="#687187" font-size="12">A quick view of the work in progress</text>

      <rect x="692" y="260" width="122" height="80" rx="12" fill="#f7f8fb" stroke="#e2e6ef"/>
      <text x="708" y="296" fill="#343c9c" font-size="28" font-weight="700">24</text>
      <text x="708" y="319" fill="#687187" font-size="11">active tickets</text>
      <rect x="830" y="260" width="122" height="80" rx="12" fill="#f7f8fb" stroke="#e2e6ef"/>
      <text x="846" y="296" fill="#343c9c" font-size="28" font-weight="700">6</text>
      <text x="846" y="319" fill="#687187" font-size="11">unassigned</text>
      <rect x="968" y="260" width="128" height="80" rx="12" fill="#f7f8fb" stroke="#e2e6ef"/>
      <text x="984" y="296" fill="#343c9c" font-size="28" font-weight="700">8</text>
      <text x="984" y="319" fill="#687187" font-size="11">urgent or high</text>

      <text x="692" y="385" fill="#20283b" font-size="14" font-weight="700">Work by queue</text>
      <rect x="692" y="405" width="404" height="38" rx="9" fill="#f5f6fb"/>
      <text x="708" y="429" fill="#48536b" font-size="12">Billing</text>
      <rect x="1000" y="418" width="70" height="8" rx="4" fill="#dfe1ff"/>
      <rect x="1000" y="418" width="48" height="8" rx="4" fill="#4b55c7"/>
      <rect x="692" y="455" width="404" height="38" rx="9" fill="#f5f6fb"/>
      <text x="708" y="479" fill="#48536b" font-size="12">Technical</text>
      <rect x="1000" y="468" width="70" height="8" rx="4" fill="#dfe1ff"/>
      <rect x="1000" y="468" width="31" height="8" rx="4" fill="#4b55c7"/>
